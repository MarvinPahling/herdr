onboarding = false
[ui]
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"
accent = "#bb9dbd"

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+space"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+shift+p"
focus_pane_left = "prefix+h"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
split_horizontal = "prefix+minus"
toggle_sidebar = "prefix+tab"

[[keys.command]]
key = "prefix+p"
type = "pane"
command = "/bin/sh /Users/vwsywfa/.config/herdr/new-pi-tab.sh"

[experimental]
kitty_graphics = true
